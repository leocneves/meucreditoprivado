<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid line accents -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="80" y1="260" x2="432" y2="260" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Financial Trend Growth Bars -->
  <rect x="110" y="270" width="46" height="90" rx="10" fill="#ffffff" fill-opacity="0.25" />
  <rect x="180" y="210" width="46" height="150" rx="10" fill="#ffffff" fill-opacity="0.4" />
  <rect x="250" y="150" width="46" height="210" rx="10" fill="#38bdf8" fill-opacity="0.85" />
  <rect x="320" y="100" width="46" height="260" rx="10" fill="#10b981" />

  <!-- Trending curve line overlay -->
  <path d="M 133 260 Q 220 180, 343 95" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" filter="url(#shadow)" />
  <circle cx="343" cy="95" r="16" fill="#34d399" stroke="#ffffff" stroke-width="6" />

  <!-- Brand Text "FIX" in white and "DATA" in cyan -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="74" letter-spacing="2" fill="#ffffff">
    FIX<tspan fill="#bae6fd">DATA</tspan>
  </text>
</svg>
